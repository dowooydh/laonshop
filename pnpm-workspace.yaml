# 단일 앱(모노레포 아님). 의존성 네이티브 빌드 스크립트 승인 (pnpm allowBuilds, v10.26+).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Next 15·Prisma 6의 하위 의존성을 현재 보안 패치 버전으로 통일한다.
overrides:
  postcss: 8.5.23
  nanoid: 3.3.18
  deepmerge-ts: 8.0.0
  sharp: 0.35.3
