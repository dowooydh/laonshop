# 단일 앱(모노레포 아님). 의존성 네이티브 빌드 스크립트 승인 (pnpm allowBuilds, v10.26+).
# run/exec가 검증 전 호스트에서 자동 설치·lifecycle을 실행하지 않게 한다.
verifyDepsBeforeRun: error

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Next 15·Prisma 6의 하위 의존성을 현재 보안 패치 버전으로 통일한다.
overrides:
  postcss: 8.5.23
  nanoid: 3.3.18
  deepmerge-ts: 8.0.0
  sharp: 0.35.5
  baseline-browser-mapping@>=2.0.0 <2.11.0: 2.11.0
  brace-expansion@>=1.0.0 <1.1.21: 1.1.21
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  browserslist@>=4.0.0 <4.28.7: 4.28.7
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
  minimatch@>=7.0.0 <11.0.1: 11.0.1
  postcss-selector-parser@>=6.0.0 <6.1.5: 6.1.5
  source-map-js@<1.2.2: 1.2.2
